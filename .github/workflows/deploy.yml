name: Book Review CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: devops-portfolio-499605
  REGION: us-central1
  GAR_REPO: book-review-repo
  BACKEND_IMAGE: us-central1-docker.pkg.dev/devops-portfolio-499605/book-review-repo/book-review-backend
  FRONTEND_IMAGE: us-central1-docker.pkg.dev/devops-portfolio-499605/book-review-repo/book-review-frontend

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://book-review-backend-90865511458.us-central1.run.app
        run: npm run build

  deploy:
    name: Build, push and deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/90865511458/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deployer@devops-portfolio-499605.iam.gserviceaccount.com

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://book-review-backend-90865511458.us-central1.run.app \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ./frontend

      - name: Push backend image
        run: docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Push frontend image
        run: docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="backend_image=${{ env.BACKEND_IMAGE }}:${{ github.sha }}" \
            -var="frontend_image=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" \
            -var="allowed_origins=https://book-review-frontend-90865511458.us-central1.run.app"

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="backend_image=${{ env.BACKEND_IMAGE }}:${{ github.sha }}" \
            -var="frontend_image=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" \
            -var="allowed_origins=https://book-review-frontend-90865511458.us-central1.run.app"